<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Scraper - Download Manager</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        html { width: 500px; height: 700px; }
    </style>
</head>
<body style="width: 500px; height: 700px;">
    <div id="container" style="width: 100%; height: 100%;">
        <!-- Header -->
        <header class="header">
            <h1>📥 Media Scraper</h1>
            <div class="header-controls">
                <label class="toggle-switch">
                    <input type="checkbox" id="multiple-toggle">
                    <span class="slider"></span>
                </label>
                <span id="toggle-label">Multiple Mode: OFF</span>
            </div>
        </header>

        <!-- Queue Display Area -->
        <section class="queue-section">
            <h2>Selected Items (<span id="queue-count">0</span>)</h2>
            <div id="queue-list" class="queue-items">
                <p class="empty-message">No items selected. Click the button on images/videos to add them.</p>
            </div>
            
            <!-- Download Button -->
            <button id="download-btn" class="btn btn-primary btn-download" disabled>
                Download All
            </button>
        </section>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stat-item">
                <span class="stat-label">Total Selected:</span>
                <span class="stat-value" id="stat-selected">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Downloaded:</span>
                <span class="stat-value" id="stat-downloaded">0</span>
            </div>
        </section>
    </div>

    <script src="popup.js"></script>
</body>
</html>
