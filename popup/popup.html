<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Scraper - Download Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="container">
        <!-- Header -->
        <header>
            <h1>📥 Media Scraper</h1>
            <button id="settings-btn" class="header-btn" title="Settings">⚙️</button>
        </header>

        <!-- Main Content Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="downloads">Downloads</button>
            <button class="tab-btn" data-tab="history">History</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </div>

        <!-- Downloads Tab -->
        <section id="downloads-tab" class="tab-content active">
            <div class="section">
                <h2>Active Downloads</h2>
                <div id="active-downloads" class="download-list">
                    <p class="empty-message">No active downloads</p>
                </div>
            </div>
            <div class="section">
                <h2>Queued Downloads</h2>
                <div id="queued-downloads" class="download-list">
                    <p class="empty-message">No queued downloads</p>
                </div>
            </div>
        </section>

        <!-- History Tab -->
        <section id="history-tab" class="tab-content">
            <div class="section">
                <h2>Download History</h2>
                <div id="history-list" class="download-list">
                    <p class="empty-message">No download history</p>
                </div>
            </div>
            <button id="clear-history-btn" class="btn btn-danger">Clear History</button>
        </section>

        <!-- Settings Tab -->
        <section id="settings-tab" class="tab-content">
            <div class="section">
                <h2>Settings</h2>
                <label>
                    <input type="checkbox" id="auto-organize" checked>
                    Auto-organize downloads by type
                </label>
                <label>
                    <input type="checkbox" id="show-notifications" checked>
                    Show download notifications
                </label>
            </div>
        </section>
    </div>

    <script src="popup.js"></script>
</body>
</html>
